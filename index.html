<!DOCTYPE html>
<html>
<head>
    <title>Sorting Analyzer</title>
</head>

<body>

<h1>Sorting Algorithm Analyzer</h1>

<form method="POST">

    <input
        type="text"
        name="numbers"
        placeholder="45,7,33,18,90"
        required
    >

    <button type="submit">
        Compare
    </button>

</form>

{% if bubble_time %}

<h2>Results</h2>

<p>
Bubble Sort:
{{ bubble_time }} ms
</p>

<p>
Insertion Sort:
{{ insertion_time }} ms
</p>

<p>
Merge Sort:
{{ merge_time }} ms
</p>

{% endif %}

</body>
</html>
